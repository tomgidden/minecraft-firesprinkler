modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT"
mixins = [{config = "firesprinkler.mixins.json"}]

[[mods]]
modId = "firesprinkler"
logoFile = "icon.png"
version = "${version}"
displayName = "Fire Sprinkler"
description = """
Place a button on the underside of a waterlogged block (or a block below a water source) to make it act as a fire sprinkler: fires within a downward spray cone are extinguished like rain, with hiss and smoke, and burning mobs are put out too. Server-side only.
"""

[[dependencies.firesprinkler]]
modId = "neoforge"
type = "required"
versionRange = "[26.1.2,27)"
ordering = "NONE"
side = "BOTH"

[[dependencies.firesprinkler]]
modId = "minecraft"
type = "required"
versionRange = "[26.1.2,27)"
ordering = "NONE"
side = "BOTH"
